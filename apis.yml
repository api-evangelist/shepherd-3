description: >-
  Shepherd is a Y Combinator-backed (W21) insurtech modernizing commercial
  insurance for the construction and renewable energy sectors. Using technology
  and data-driven underwriting, it delivers faster decisions and clearer risk
  insights across Primary Casualty, Excess Casualty, and Builder's Risk coverage
  for middle-market to enterprise builders and operators. As of this enrichment
  pass Shepherd does not publish a public developer API, SDKs, MCP server, or a
  developer portal — this profile captures the company identity and public web
  properties only.
